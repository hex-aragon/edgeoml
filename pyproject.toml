[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeoml-bench"
version = "0.1.0"
description = "Benchmark OML fingerprint robustness across on-device deployment transformations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "EdgeOML contributors" }]
dependencies = []

[project.scripts]
edgeoml = "edgeoml.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
