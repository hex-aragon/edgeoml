model: experiments/m4-lora-pilot/models/base
train: true
fine_tune_type: lora
optimizer: adam
data: experiments/m4-lora-pilot/data
seed: 42
num_layers: 28
batch_size: 1
iters: 640
val_batches: -1
learning_rate: 0.0001
steps_per_report: 20
steps_per_eval: 80
grad_accumulation_steps: 1
adapter_path: experiments/m4-lora-pilot/adapters
save_every: 160
test: true
test_batches: -1
max_seq_length: 128
grad_checkpoint: false
clear_cache_threshold: 8589934592
mask_prompt: true
lora_parameters:
  keys: ["self_attn.q_proj", "self_attn.v_proj"]
  rank: 16
  scale: 32.0
  dropout: 0.0
